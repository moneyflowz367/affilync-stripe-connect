services:
  # Backend API
  - type: web
    name: affilync-stripe-connect
    runtime: python
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CLIENT_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: affilync-db
          property: connectionString
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: AFFILYNC_API_KEY
        sync: false
      - key: AFFILYNC_API_URL
        value: https://api.affilync.com
      - key: FRONTEND_URL
        value: https://connect.affilync.com
      - key: CORS_ORIGINS
        value: https://connect.affilync.com,http://localhost:3000

  # Frontend (Static)
  - type: web
    name: affilync-stripe-connect-frontend
    runtime: static
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /api/*
        destination: https://affilync-stripe-connect.onrender.com/api/*
      - type: rewrite
        source: /oauth/*
        destination: https://affilync-stripe-connect.onrender.com/oauth/*
      - type: rewrite
        source: /webhooks/*
        destination: https://affilync-stripe-connect.onrender.com/webhooks/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

databases:
  - name: affilync-db
    databaseName: affilync_db
    plan: starter
